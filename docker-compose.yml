version: "3.9"

services:
  # ── PostgreSQL + PostGIS ──────────────────────────
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: safeway
      POSTGRES_PASSWORD: safeway
      POSTGRES_DB: safeway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeway"]
      interval: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ── SafeWay API ───────────────────────────────────
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://safeway:safeway@db:5432/safeway
      DATABASE_URL_SYNC: postgresql+psycopg://safeway:safeway@db:5432/safeway
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    command: >
      bash -c "alembic upgrade head &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
